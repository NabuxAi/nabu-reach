name: Test Nabu Reach

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q reach tests demo/build.py
      - name: Local MVP tests
        run: python -m unittest discover -s tests -v
      - name: Build static public demo
        run: python demo/build.py
      - name: Verify build does not include Python backend
        run: |
          test -f dist/demo/index.html
          test ! -f dist/demo/server.py
          grep -q 'PUBLIC INTERACTIVE DEMO' dist/demo/index.html

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check reach/web/app.js
          node --check demo/mock.js
      - name: Consent and mock API checks
        run: node tests/test_demo.js
